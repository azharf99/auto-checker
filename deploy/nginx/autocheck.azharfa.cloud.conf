# Konfigurasi Nginx Reverse Proxy untuk: autocheck.azharfa.cloud
# Simpan di VPS pada: /etc/nginx/sites-available/autocheck.azharfa.cloud
# Aktifkan dengan:
#   sudo ln -s /etc/nginx/sites-available/autocheck.azharfa.cloud /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d autocheck.azharfa.cloud

server {
    listen 80;
    listen [::]:80;
    server_name autocheck.azharfa.cloud;

    # Batas ukuran body request (cukup untuk payload JSON daftar tugas & cookie)
    client_max_body_size 5M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        # Teruskan ke container algonova-auto-checker yang hanya bind di localhost:8097
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;

        # Teruskan IP asli pengunjung agar Brute-Force Rate Limiter Go bekerja akurat per IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # PENTING: Proses Scan / Execute 50-100 tugas memiliki jeda anti rate-limit (1-3 menit).
        # Naikkan timeout dari default 60s ke 300s (5 menit) agar tidak terkena 504 Gateway Time-out.
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
